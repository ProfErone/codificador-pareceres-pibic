<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Codificador de Pareceres PIBIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Caderno de pesquisa em Educação: lousa verde no topo, página de leitura em serifa, anotações a lápis de cor.
     Cor = dimensão do desenvolvimento. Tinta = lastro de observação. Layout: lista de pareceres | folha de trabalho. */
  --paper:#f1f3ee; --card:#ffffff; --wash:#f6f8f4; --ink:#17251f; --ink-2:#44534b; --muted:#5c6a62; --line:#d6dcd3; --line-2:#e6eae2;
  --lousa:#1d4a3b; --lousa-2:#163a2e; --giz:#f4f1e4; --giz-2:#b9cfc4; --giz-acc:#f2cf63;
  --accent:#1f6b52; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --ok:#1c6b45; --ok-soft:#e1f1e7; --warn:#8a5300; --warn-soft:#fbeed0; --bad:#a8231c; --bad-soft:#fbe5e2;
  --dmf:#e16c10; --dmf-t:#fae5d4; --dms:#a7031a; --dms-t:#efd2d6; --dmc:#3792fd; --dmc-t:#dbebff; --dml:#7829a5; --dml-t:#e7d8ef;
  --n0:#82bb9f; --n1:#38815f; --n2:#164d3a; --n0-ink:#17251f; --n1-ink:#ffffff; --n2-ink:#ffffff; --bar:#2a7a5e;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-doc:"Literata",Georgia,"Times New Roman",serif;
  --f-code:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px; --sombra:0 1px 2px rgba(23,37,31,.06),0 8px 24px rgba(23,37,31,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101512; --card:#19211d; --wash:#1f2924; --ink:#e8ede9; --ink-2:#c2ccc5; --muted:#98a69e; --line:#303b35; --line-2:#262f2a;
    --lousa:#143327; --lousa-2:#0f271e; --giz:#f1eee0; --giz-2:#a9c0b5; --giz-acc:#f0cd62;
    --accent:#6fc7a4; --accent-ink:#0b1410; --accent-soft:#1c392e;
    --ok:#7fd0a3; --ok-soft:#16301f; --warn:#e8b860; --warn-soft:#3a2d10; --bad:#f28d83; --bad-soft:#421c19;
    --dmf:#ac5107; --dmf-t:#452f16; --dms:#ef546c; --dms-t:#593035; --dmc:#0374b7; --dmc-t:#123a4b; --dml:#9477fc; --dml-t:#3e3b60;
    --n0:#35634f; --n1:#57a583; --n2:#9be3c3; --n0-ink:#e8ede9; --n1-ink:#0b1410; --n2-ink:#0b1410; --bar:#57a583;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101512; --card:#19211d; --wash:#1f2924; --ink:#e8ede9; --ink-2:#c2ccc5; --muted:#98a69e; --line:#303b35; --line-2:#262f2a;
  --lousa:#143327; --lousa-2:#0f271e; --giz:#f1eee0; --giz-2:#a9c0b5; --giz-acc:#f0cd62;
  --accent:#6fc7a4; --accent-ink:#0b1410; --accent-soft:#1c392e;
  --ok:#7fd0a3; --ok-soft:#16301f; --warn:#e8b860; --warn-soft:#3a2d10; --bad:#f28d83; --bad-soft:#421c19;
  --dmf:#ac5107; --dmf-t:#452f16; --dms:#ef546c; --dms-t:#593035; --dmc:#0374b7; --dmc-t:#123a4b; --dml:#9477fc; --dml-t:#3e3b60;
  --n0:#35634f; --n1:#57a583; --n2:#9be3c3; --n0-ink:#e8ede9; --n1-ink:#0b1410; --n2-ink:#0b1410; --bar:#57a583;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-doc);font-weight:600;text-wrap:balance;letter-spacing:-.005em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lousa :focus-visible{outline-color:var(--giz-acc)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .peq{font-size:13px} .num{font-variant-numeric:tabular-nums}
.cod{font-weight:700;letter-spacing:.01em;white-space:nowrap}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.lousa{background:var(--lousa);color:var(--giz);display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;align-items:center;gap:6px 32px;padding:12px 20px;border-bottom:1px solid var(--lousa-2)}
.marca{display:flex;flex-direction:column;min-width:0}
.marca b{font:600 20px/1.2 var(--f-doc)}
.marca span{font-size:12.5px;color:var(--giz-2)}
.vistas{display:flex;gap:2px;flex-wrap:wrap}
.vistas a{padding:6px 12px;text-decoration:none;color:var(--giz-2);border-bottom:2px solid transparent;font-size:14.5px}
.vistas a:hover{color:var(--giz)}
.vistas a[aria-current="page"]{color:var(--giz);border-bottom-color:var(--giz-acc)}
.estado{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--giz-2);white-space:nowrap}
.estado b{color:var(--giz);font-size:15px}
.trilho{display:inline-block;width:110px;height:6px;border-radius:99px;background:var(--lousa-2);vertical-align:middle;margin-right:8px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--giz-acc);border-radius:99px}
.guarda{display:inline-flex;align-items:center;gap:6px}
.guarda::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--giz-2)}
.guarda.conta::before{background:#8fe0b8} .guarda.local::before{background:var(--giz-acc)} .guarda.sem::before{background:#ff9d92}

.corpo{min-height:0;overflow:auto}
.corpo.duas{display:grid;grid-template-columns:264px minmax(0,1fr);overflow:hidden}
.coluna{max-width:1080px;margin:0 auto;padding:28px 20px 64px;display:grid;gap:28px}
.coluna.leitura{max-width:820px}
.carregando{display:grid;place-items:center;height:100%;color:var(--muted)}

/* ---------- botões, rótulos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.leve{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.leve:hover{text-decoration:underline}
.btn.perigo{color:var(--bad)} .btn.perigo:hover{border-color:var(--bad)}
.btn.p{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.selo{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.selo.rasc{background:var(--warn-soft);color:var(--warn)}
.selo.fin{background:var(--ok-soft);color:var(--ok)}
.selo.hist{background:var(--wash);color:var(--muted);border-color:var(--line)}
.selo.demo{background:var(--accent-soft);color:var(--accent)}
.selo.falta{background:var(--bad-soft);color:var(--bad)}

/* ---------- lista de pareceres ---------- */
aside.lista{background:var(--card);border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.lista .topo{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--line-2)}
.lista input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--wash)}
.itens{overflow:auto;padding:8px;display:grid;gap:2px;align-content:start}
.item{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:9px 10px;border-radius:var(--r);border:1px solid transparent;background:none;text-align:left;width:100%}
.item:hover{background:var(--wash)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item .c{font:600 17px/1.2 var(--f-doc)}
.item .m{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.lista .pe{padding:12px 14px;border-top:1px solid var(--line-2);display:grid;gap:6px}
.lista .pe .btn{justify-content:flex-start}
.lista .pe p{font-size:12.5px;color:var(--muted)}

/* ---------- folha de trabalho ---------- */
main.folha{overflow:auto;min-height:0}
.vazio{max-width:560px;margin:72px auto;padding:0 20px;display:grid;gap:14px}
.cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:22px 24px 0}
.cab h1{font-size:30px;line-height:1.1}
.cab .meta{color:var(--muted);font-size:14px}
.aviso{margin:14px 24px 0;padding:10px 14px;border-radius:var(--r);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;border:1px solid transparent}
.aviso.fin{background:var(--ok-soft);color:var(--ok)}
.aviso.hist{background:var(--wash);color:var(--muted);border-color:var(--line)}
.aviso.demo{background:var(--accent-soft);color:var(--accent)}
.aviso.alerta{background:var(--warn-soft);color:var(--warn)}
.aviso .dito{flex:1 1 320px;min-width:0}
.aviso .btn{margin-left:auto}
.aviso .btn + .btn{margin-left:0}
.passos li{display:flex}
.passos{display:flex;gap:0;padding:18px 24px 0;margin:0;list-style:none;border-bottom:1px solid var(--line);overflow-x:auto}
.passo{display:flex;align-items:center;gap:8px;padding:9px 16px 10px;border:none;background:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:700}
.passo .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12.5px}
.passo[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.passo[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.passo .ok{color:var(--ok);font-size:13px} .passo .pend{font-size:12px;padding:0 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.area{padding:22px 24px 56px}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.pilha{display:grid;gap:18px}
.g2{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.6fr);gap:18px;align-items:start}
.campo{display:grid;gap:6px}
.campo > label,.rot{font-size:13px;font-weight:700;color:var(--ink-2)}
.campo .dica,.dica{font-size:13px;color:var(--muted)}
.fixo{padding:7px 10px;border-radius:var(--r);background:var(--wash);border:1px dashed var(--line);font-weight:700}
textarea,.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);resize:vertical}
textarea.doc{font:17px/1.7 var(--f-doc);min-height:300px}
.docver{font:17px/1.7 var(--f-doc);white-space:pre-wrap;overflow:auto;max-height:420px;padding:14px 18px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--wash)}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}

/* fichas de escolha */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-size:14px;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip .cod{font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700;color:var(--accent)}
.chip.sug{border-style:dashed;border-color:var(--accent)}
.chip[disabled]{cursor:default;opacity:.92} .chip[disabled]:hover{border-color:var(--line)} .chip[aria-pressed="true"][disabled]:hover{border-color:var(--accent)}
.chip.dim .pt{width:10px;height:10px;border-radius:50%;background:var(--d)}
.chip.dim[aria-pressed="true"]{background:var(--dt);border-color:var(--d);box-shadow:inset 0 0 0 1px var(--d)}
.chip.dim[aria-pressed="true"]::before{content:none}
.chip.alerta[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.chip.alerta[aria-pressed="true"]::before{color:var(--warn)}
.DMF{--d:var(--dmf);--dt:var(--dmf-t)} .DMS{--d:var(--dms);--dt:var(--dms-t)} .DMC{--d:var(--dmc);--dt:var(--dmc-t)} .DML{--d:var(--dml);--dt:var(--dml-t)}
details.ajuda{font-size:13.5px}
details.ajuda > summary{cursor:pointer;color:var(--accent);font-weight:700;width:max-content;list-style-position:inside}
details.ajuda dl{margin:8px 0 0;display:grid;gap:8px}
details.ajuda dt{font-weight:700}
details.ajuda dd{margin:0;color:var(--ink-2)}
details.ajuda dd i{font-family:var(--f-doc);color:var(--muted)}

/* ---------- codificação ---------- */
.cod2{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.12fr);gap:18px;align-items:start}
.fonte{position:sticky;top:0;display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100vh - 230px);min-height:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fonte .leg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.fonte .leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.leg .pt{width:9px;height:9px;border-radius:50%;background:var(--d)}
.leg .am{display:inline-block;width:22px;height:13px;border-bottom:2px solid var(--muted)}
.leg .am.n0{border-bottom-style:dotted} .leg .am.n2{background:var(--line)}
.texto{overflow:auto;padding:18px 22px;font:17px/1.85 var(--f-doc);white-space:pre-wrap;overflow-wrap:break-word}
.texto mark{color:inherit;background:none;cursor:pointer;padding:2px 0;border-bottom:2px solid var(--d,var(--muted));-webkit-box-decoration-break:clone;box-decoration-break:clone}
.texto mark.n0{border-bottom-style:dotted}
.texto mark.n2{background:var(--dt)}
.texto mark.sd{border-bottom:2px dashed var(--muted)}
.texto mark.at{outline:2px solid var(--ink);outline-offset:1px;border-radius:2px}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line-2);background:var(--wash);font-size:13.5px}
.tira{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.exb{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;border-left:4px solid var(--d,var(--line))}
.exb[aria-current="true"]{box-shadow:0 0 0 2px var(--ink)}
.exb.err{border-color:var(--bad);color:var(--bad)}
.gl{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--n2);flex:none}
.gl.Traco{background:linear-gradient(90deg,var(--n2) 50%,transparent 50%)} .gl.Lastro{background:var(--n2)}
.editor{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:0}
blockquote.lit{margin:0;padding:12px 16px;border-left:4px solid var(--d,var(--line));background:var(--wash);font:17px/1.65 var(--f-doc);border-radius:0 var(--r) var(--r) 0}
blockquote.lit u{text-decoration:underline dotted var(--accent) 2px;text-underline-offset:4px}
.exmeta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.q{display:grid;gap:10px;padding:18px 0;border-top:1px solid var(--line-2)}
.q:first-of-type{border-top:none;padding-top:16px}
.q > h3{font-size:19px;line-height:1.25}
.q > h3 small{font:400 13px var(--f-ui);color:var(--muted);margin-left:8px;letter-spacing:0}
.sub{display:grid;gap:6px}
.ancoras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.anc{display:grid;gap:2px;padding:9px 10px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);text-align:left;min-height:74px;align-content:start}
.anc:hover{border-color:var(--n1)}
.anc .cod{font-size:12.5px;color:var(--muted)}
.anc b{font-size:14.5px;line-height:1.2}
.anc span.p{font-size:12.5px;color:var(--muted);line-height:1.25}
.anc[aria-pressed="true"]{background:var(--n2);border-color:var(--n2);color:var(--n2-ink)}
.anc[aria-pressed="true"] .cod,.anc[aria-pressed="true"] span.p{color:inherit;opacity:.85}
.anc.sug{border-style:dashed;border-color:var(--n1)}
.anc[disabled]{cursor:default}
.regua{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:var(--r);overflow:hidden}
.regua div{padding:7px 12px;background:var(--wash);color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:0;border:1px solid var(--line-2);line-height:1.3}
.regua div b{font-size:14.5px}
.regua div.on{color:var(--ni);background:var(--nb);border-color:var(--nb)}
.regua .Ausencia{--nb:var(--n0);--ni:var(--n0-ink)} .regua .Traco{--nb:var(--n1);--ni:var(--n1-ink)} .regua .Lastro{--nb:var(--n2);--ni:var(--n2-ink)}
.alertas{display:grid;gap:6px}
.al{padding:8px 11px;border-radius:var(--r);font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.al.e{background:var(--bad-soft);color:var(--bad)} .al.w{background:var(--warn-soft);color:var(--warn)} .al.i{background:var(--wash);color:var(--ink-2)}
.al b{white-space:nowrap}
.pe-ed{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line-2)}

/* ---------- fechamento ---------- */
.fec{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.ficha > h2{font-size:20px;margin-bottom:4px}
.ficha > h2 + .dica{margin-bottom:14px}
.bloco{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line-2)}
.bloco:first-of-type{border-top:none;padding-top:0}
.bloco h3{font:700 14px var(--f-ui);color:var(--ink-2);letter-spacing:0}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line-2);padding:7px 8px;text-align:left;vertical-align:top}
table.t thead th{font-size:12.5px;color:var(--muted);font-weight:700;border-bottom-color:var(--line)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
.rol{overflow-x:auto}
table.calc td:first-child{width:32%;font-weight:700;color:var(--ink-2)}
ul.conf{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.conf li{display:flex;gap:9px;align-items:baseline;font-size:14px}
ul.conf .s{font-weight:700;width:16px;flex:none}
.sim{color:var(--ok)} .nao{color:var(--bad)} .at{color:var(--warn)}
pre.json{max-height:380px;overflow:auto;background:var(--wash);border:1px solid var(--line-2);border-radius:var(--r);padding:12px;font:12px/1.5 var(--f-code);white-space:pre;margin:10px 0 0}

/* ---------- gráficos ---------- */
.seg{display:flex;gap:2px;height:28px;width:100%}
.seg.fina{height:14px}

.lin{display:grid;grid-template-columns:minmax(120px,220px) minmax(80px,1fr) 168px;gap:12px;align-items:center;font-size:14px}
.lin .nome{display:flex;gap:7px;align-items:center;min-width:0}
.lin .nome .pt{width:9px;height:9px;border-radius:50%;background:var(--d);flex:none}
.lin .fig{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.trb{height:12px;border-radius:0 4px 4px 0;background:var(--line-2);position:relative;overflow:hidden}

.grupo{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}

.kpi b{font-size:30px;line-height:1.15;font-weight:700}
.kpi.um b{font-size:48px}
.kpi span{font-size:13.5px;color:var(--ink-2)}
.kpi small{font-size:12.5px;color:var(--muted)}
figure.fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:14px}

details.nums > summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13.5px;width:max-content}
.faixa{padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);font-size:14px}
.titulo-vista{display:grid;gap:6px}
.titulo-vista h1{font-size:30px}
.titulo-vista p{color:var(--ink-2);max-width:72ch}

/* ---------- concordância ---------- */
.conc{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.kap{display:inline-flex;align-items:center;gap:8px}
.kap .tr{width:70px;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.kap .tr i{display:block;height:100%;background:var(--bar)}
.div{display:grid;gap:10px}
.dv{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}

/* ---------- método ---------- */
.leitura h2{font-size:23px;margin-bottom:8px}
.leitura p{max-width:68ch}
.leitura section{display:grid;gap:10px}
.perg{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}

details.livro{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 16px}

details.livro td i{font-family:var(--f-doc);color:var(--ink-2)}
ul.refs{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}

/* ---------- camadas ---------- */
.fundo{position:fixed;inset:0;background:rgba(10,18,14,.55);display:grid;place-items:center;padding:16px;z-index:30}

  .anc,.regua div,.chip{transition:background-color .12s,border-color .12s,color .12s}
}

<script>
"use strict";
/* ======================= SEÇÃO 01 · configuração e livro de códigos ======================= */
/* =====================================================================
   Codificador de Pareceres — PIBIC/UNOESC
   Instrumento de análise de conteúdo (Bardin) para pareceres descritivos.
   Página única, sem dependências. Os dados ficam na conta de quem codifica.
   ===================================================================== */

const APP = {
  nome: "Codificador de Pareceres",
  versao: "1.0.1-piloto",
  schema: "pibic-pareceres/2.0",
  modelo: 4,                       // versão das regras e do formato dos dados
  total: 60,                       // pareceres previstos no corpus
  projeto: "Dimensões do desenvolvimento infantil nos pareceres descritivos: análise documental na pré-escola",
  livro: "Livro de Códigos, revisão de 13/11/2026"
};
const PREFIXO_LS = "pibic:";       // armazenamento local, uma chave por parecer
const CHAVE_LS_ANTIGA = "pibic_pareceres_v1";
const LIMITE_PALAVRAS_EXCERTO = 60; // acima disso, o instrumento sugere recortar

/* ---------- Identificação do parecer (valores da planilha original) ---------- */
const IDENT = [
  { f: "tipo_instituicao", rot: "Tipo de instituição", op: [["EMEB", "EMEB"], ["CMEI", "CMEI"]] },
  { f: "semestre", rot: "Semestre", op: [["2026/2", "2026/2"], ["2027/1", "2027/1"]] },
  { f: "idade", rot: "Idade da criança", op: [["4", "4 anos"], ["5", "5 anos"]] },
  { f: "imigracao", rot: "Imigração", op: [["Sim", "Sim"], ["Nao", "Não"], ["Nao informado", "Não informado"]] }
];
const rotIdent = (f, v) => { const g = IDENT.find(x => x.f === f); const o = g && g.op.find(x => x[0] === String(v)); return o ? o[1] : String(v || ""); };

/* ---------- Livro de códigos ---------- */
const DIMS = [
  { c: "DMF", n: "Física/motora", d: "Corpo, movimento, controle motor, coordenação, equilíbrio, autonomia em ações corporais.", ex: "No parque, tem subido no trepa-trepa com mais segurança do que no início do semestre." },
  { c: "DMS", n: "Socioafetiva", d: "Relações da criança com os outros e com ela mesma: amizade, cooperação, conflito, autonomia, expressão de sentimentos, regras de convivência.", ex: "Nas atividades em pequenos grupos, tem procurado os colegas para dividir os materiais e espera a sua vez de falar." },
  { c: "DMC", n: "Cognitiva", d: "Como a criança pensa, resolve problemas, compreende o mundo, faz hipóteses, memoriza, classifica, conta, estabelece relações.", ex: "Ao montar a torre com blocos, testou várias formas de encaixe até conseguir que ficasse em pé, e explicou aos colegas como fez." },
  { c: "DML", n: "Linguística", d: "Fala, escuta, narrativa, vocabulário, argumentação, compreensão da língua, escrita, leitura, expressão por linguagens.", ex: "Ao recontar a história da roda, lembrou a ordem dos acontecimentos e incluiu falas dos personagens." }
];
const DIREITOS = [
  { c: "DCon", n: "Conviver", d: "Relação com colegas e adultos, regras de convivência, cuidado com o outro.", ex: "Nas brincadeiras de faz de conta, dividiu o papel de mãe com a colega." },
  { c: "DBri", n: "Brincar", d: "Brincadeira, jogo, faz de conta, imaginação.", ex: "Na casinha, criou uma história em que a boneca ia ao médico." },
  { c: "DPar", n: "Participar", d: "Envolvimento nas atividades coletivas, roda, projetos, decisões do grupo.", ex: "Na roda de conversa, pediu a palavra para contar o que viu no caminho para a escola." },
  { c: "DExp", n: "Explorar", d: "Curiosidade, investigação, manuseio de materiais, descoberta. Não confundir com DExpr.", ex: "No pátio, recolheu folhas diferentes e comparou tamanhos." },
  { c: "DExpr", n: "Expressar", d: "Expressão por linguagens: fala, desenho, música, corpo, dramatização. Não confundir com DExp.", ex: "Desenhou a família e explicou cada personagem ao mostrar aos colegas." },
  { c: "DConh", n: "Conhecer-se", d: "Identidade, reconhecimento de si, do próprio corpo, das preferências, autonomia. Não confundir com DCon.", ex: "Ao se olhar no espelho, disse que agora consegue pentear o próprio cabelo." }
];
const CAMPOS = [
  { c: "EO", n: "O eu, o outro e o nós", d: "Convivência, identidade, relações, pertencimento.", ex: "Falou sobre a família que chegou de outro país e comparou com a dos colegas." },
  { c: "CG", n: "Corpo, gestos e movimentos", d: "Movimento, corpo, dança, expressão corporal.", ex: "Na atividade de música, acompanhou o ritmo com o corpo." },
  { c: "TS", n: "Traços, sons, cores e formas", d: "Arte, desenho, pintura, música, materiais expressivos.", ex: "Experimentou misturar tintas e nomeou as cores que apareceram." },
  { c: "EF", n: "Escuta, fala, pensamento e imaginação", d: "Linguagem oral, narrativa, escuta, imaginação.", ex: "Ouviu a história e comentou o que achou do final." },
  { c: "ET", n: "Espaços, tempos, quantidades, relações e transformações", d: "Noções matemáticas, tempo, espaço, comparações, natureza.", ex: "Organizou os brinquedos por tamanho ao arrumar a sala." }
];
const MATRIZ = [
  { c: "PMon", n: "Monitoramento", d: "Acompanhamento ao longo do tempo, progressão, retomada de observações anteriores.", ex: "Comparando com o bimestre anterior, tem avançado na espera pela vez." },
  { c: "PDoc", n: "Documentação", d: "Registro pedagógico organizado, com descrição de situações e evidências.", ex: "Registramos que, na atividade de culinária, mediu os ingredientes com apoio da professora." },
  { c: "PCom", n: "Comunicação", d: "Comunicação à família sobre o percurso da criança, com linguagem acessível.", ex: "Conversamos com a família sobre esse avanço na fala." },
  { c: "PDia", n: "Diálogo", d: "Escuta da criança, participação dela nas decisões ou na avaliação.", ex: "A criança escolheu o que queria mostrar no portfólio." }
];
/* Âncoras de observação: as quatro marcas que definem o nível do registro */
const ANCORAS = [
  { c: "M1", n: "Situação", nome: "Ancoragem situacional", p: "Em que situação?", d: "O trecho remete a uma situação, atividade, rotina ou momento identificável.", ind: "durante, na roda, no parque, na atividade de, quando, ao, no momento em que" },
  { c: "M2", n: "Tempo", nome: "Ancoragem temporal", p: "Quando, ou desde quando?", d: "O trecho indica período ou progressão.", ind: "neste semestre, desde o início do ano, nas últimas semanas, passou a, tem avançado em, inicialmente… atualmente" },
  { c: "M3", n: "Observação declarada", nome: "Base em observação declarada", p: "Diz que foi observado?", d: "O texto assume a origem observacional do que afirma.", ind: "observamos que, tem sido possível perceber, nas situações observadas, registramos que, chama a atenção que" },
  { c: "M4", n: "Processo", nome: "Descrição de processo", p: "Como a criança faz?", d: "O trecho descreve como a criança faz, e não apenas o que ela é.", ind: "vem construindo, tem experimentado, vem demonstrando; verbo de ação com objeto ou finalidade" }
];
const ROTULO = { c: "M5", n: "Rótulo", nome: "Vocabulário rotulador", d: "Adjetivo fixo que nomeia um suposto atributo interno, em vez de descrever comportamento observável. Não altera o nível do registro.", ind: "imaturo, carente, agressivo, desatento, preguiçoso, esperto, acanhada, agitado, sem limites, difícil, atrasado" };
const ANC = ANCORAS.map(a => a.c);
const MARCAS_VALIDAS = [...ANC, ROTULO.c];

/* Categorias emergentes. Os valores gravados são os da planilha original. */
const NM = "NAO_MENCIONADO";
const EMERG = [
  { f: "esp_nivel", c: "ESP", n: "Escolarização precoce", d: "O trecho trata a criança de 4 ou 5 anos com a lógica do Ensino Fundamental, antecipando alfabetização e cobrando prontidão.",
    niveis: [
      { v: "Nivel 2 - Indicio parcial", n: "Indício parcial", d: "Aparece um elemento isolado, que não é o foco do trecho.", ex: "Reconhece algumas letras do próprio nome." },
      { v: "Nivel 3 - Presente e central", n: "Presente e central", d: "A expectativa de prontidão organiza o registro.", ex: "Já está pronta para o primeiro ano, pois conhece todas as letras e conta até 20." }
    ], misto: null },
  { f: "blg_nivel", c: "BLG", n: "Barreira linguística", d: "O trecho trata da língua da criança imigrante.",
    niveis: [
      { v: "Nivel 2 - Registro deficitario", n: "Registro deficitário", d: "A barreira aparece como falta, limite ou atraso, sem contexto de aprendizagem.", ex: "Não fala nada." },
      { v: "Nivel 3 - Registro sensivel", n: "Registro sensível", d: "A barreira aparece situada, com estratégias de comunicação, repertório ou avanços.", ex: "Aponta e pede ajuda às professoras quando não sabe uma palavra." }
    ], misto: "Niveis 2 e 3 - Registro misto" },
  { f: "acu_nivel", c: "ACU", n: "Acolhimento cultural", d: "O trecho reconhece a bagagem cultural da criança e da família.",
    niveis: [
      { v: "Nivel 2 - Registro estereotipado", n: "Registro estereotipado", d: "A cultura aparece como curiosidade, exotismo ou generalização.", ex: "" },
      { v: "Nivel 3 - Registro sensivel", n: "Registro sensível", d: "A cultura aparece como repertório da criança, com valor pedagógico.", ex: "Em casa, a família fala espanhol." }
    ], misto: "Niveis 2 e 3 - Registro misto" }
];
const rotEmerg = (g, v) => v === NM || !v ? "Não mencionado" : v === g.misto ? "Registro misto" : (g.niveis.find(x => x.v === v) || { n: v }).n;

/* Nível do registro: valores gravados (planilha) e nomes exibidos */
const NIVEIS = ["Ausencia", "Traco", "Lastro"];
const ROT_NIVEL = { Ausencia: "Sem lastro", Traco: "Traço", Lastro: "Lastro" };
const ROT_PRED = { "Ausencia predominante": "Sem lastro predominante", "Traco predominante": "Traço predominante", "Lastro predominante": "Lastro predominante", "Equilibrio": "Equilíbrio", "": "Sem excertos" };

/* ---------- Sugestões por palavras indicadoras (do próprio Livro de Códigos) ----------
   São apenas sugestões: quem decide é a codificadora. */
const reInd = lista => new RegExp("(^|[^\\p{L}\\p{N}])(" + lista.join("|") + ")(?![\\p{L}\\p{N}])", "giu");
const INDICADORES = {
  M1: reInd(["durante", "na roda", "nas rodas", "no parque", "no p[aá]tio", "na casinha", "na sala", "na atividade", "nas atividades", "em atividades", "na brincadeira", "nas brincadeiras",
    "no momento em que", "na hora d[oae]", "quando", "ao\\s+(?:se\\s+)?\\p{L}+(?:ar|er|ir|or)"]),
  M2: reInd(["neste semestre", "neste bimestre", "desde o in[ií]cio(?: do ano| do semestre)?", "nas [uú]ltimas semanas", "nos [uú]ltimos meses", "passou a", "tem avan[cç]ado", "vem avan[cç]ando",
    "inicialmente", "atualmente", "no in[ií]cio do (?:semestre|ano)", "bimestre anterior", "semestre anterior", "ao longo do (?:semestre|ano)"]),
  M3: reInd(["observamos(?: que)?", "tem sido poss[ií]vel perceber", "nas situa[cç][oõ]es observadas", "registramos(?: que)?", "chama a aten[cç][aã]o(?: que)?", "percebemos(?: que)?", "notamos(?: que)?"]),
  M4: reInd(["(?:vem|v[eê]m|tem|t[eê]m)\\s+(?:se\\s+)?\\p{L}+(?:ado|ido|ando|endo|indo)"]),
  M5: reInd(["imatur[oa]s?(?: para a idade)?", "carentes?", "agressiv[oa]s?", "desatent[oa]s?", "pregui[cç]os[oa]s?", "espert[oa]s?", "acanhad[oa]s?", "agitad[oa]s?", "sem limites", "dif[ií]cil", "dif[ií]ceis",
    "problemas? de comportamento", "atrasad[oa]s?", "t[ií]mid[oa]s?", "caprichos[oa]s?", "lent[oa]s?", "inteligentes?", "querid[oa]s?", "carinhos[oa]s?", "ativ[oa]s?", "coordenad[oa]s?", "atent[oa]s?",
    "alegres?", "comunicativ[oa]s?", "esfor[cç]ad[oa]s?", "bom comportamento", "boa rela[cç][aã]o", "bom desenvolvimento", "fala muito bem", "boa fala", "comunica-se bem", "compreende bem"])
};

/* ---------- Referências citadas no instrumento ---------- */
const REFERENCIAS = [
  "Bardin, L. Análise de conteúdo. (Edição adotada no projeto.)",
  "Brasil. Ministério da Educação. Base Nacional Comum Curricular: Educação Infantil (direitos de aprendizagem e campos de experiências).",
  "Cohen, J. (1960). A coefficient of agreement for nominal scales. Educational and Psychological Measurement, 20(1), 37–46.",
  "Landis, J. R.; Koch, G. G. (1977). The measurement of observer agreement for categorical data. Biometrics, 33(1), 159–174."
];


/* ======================= SEÇÃO 02 · utilidades ======================= */
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const agora = () => new Date().toISOString();
/* Carimbo de alteração: a hora de agora, mas sempre depois do carimbo anterior. Assim uma alteração feita aqui nunca perde
   para a cópia que ela alterou, mesmo que o relógio de outro aparelho esteja adiantado. */
const depoisDe = antes => { const a = agora(); return antes && antes >= a ? new Date(Date.parse(antes) + 1).toISOString() : a; };
const palavras = t => (String(t || "").trim().match(/\S+/g) || []).length;
const copia = o => JSON.parse(JSON.stringify(o));
const zeros = (n, w = 2) => String(n).padStart(w, "0");
const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const pctTxt = (a, b) => b ? pct(a, b) + "%" : "—";
const dataHora = iso => { try { return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return iso || ""; } };
const carimbo = () => { const d = new Date(); return `${d.getFullYear()}${zeros(d.getMonth() + 1)}${zeros(d.getDate())}`; };
const ehLetra = ch => !!ch && /[\p{L}\p{N}]/u.test(ch);
const comLimite = (p, ms) => Promise.race([Promise.resolve(p), new Promise((_, rej) => setTimeout(() => rej({ code: "tempo_esgotado" }), ms))]);
const ordenaCodigo = (a, b) => String(a).localeCompare(String(b), "pt", { numeric: true });

function avisar(msg, ms = 3600) {
  const r = $("#avisoRaiz"); if (!r) return;
  r.innerHTML = `<div class="aviso-flutuante" role="status">${esc(msg)}</div>`;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => { r.innerHTML = ""; }, ms);
}

/* Capacidades da plataforma (armazenamento na conta, download, segunda leitura).
   Cada uma pode faltar: a página funciona sem elas. */
const CAP = {};
function capacidade(nome) {
  if (!(nome in CAP)) {
    CAP[nome] = (window.claude && typeof window.claude.use === "function")
      ? comLimite(window.claude.use(nome), 10500).catch(() => null)
      : Promise.resolve(null);
  }
  return CAP[nome];
}

/* SHA-256 em hexadecimal; se o navegador não oferecer, usa CRC-32 (mais fraco, mas detecta alteração acidental) */
async function resumoDe(texto) {
  const bytes = new TextEncoder().encode(texto);
  try {
    const b = await crypto.subtle.digest("SHA-256", bytes);
    return "sha256:" + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    return "crc32:" + crc32(bytes).toString(16).padStart(8, "0");
  }
}
let TABELA_CRC = null;
function crc32(u8) {
  if (!TABELA_CRC) { TABELA_CRC = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; TABELA_CRC[n] = c >>> 0; } }
  let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TABELA_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}


/* ======================= SEÇÃO 03 · modelo, lei do lastro e registro ======================= */

  vista: "pareceres", sel: null, passo: "doc", ex: null, filtro: "", editTexto: false, selPend: null,

  conc: { chave: null, B: null, res: null, erro: "" },
  ia: { estado: "", ctl: null }
};

const todos = () => Object.values(S.P).filter(p => !p.excluido);
const reais = () => todos().filter(p => !p.demo && p.status !== "substituido");
const finalizados = () => reais().filter(p => p.status === "finalizado");
const atual = () => { const p = S.P[S.sel]; return p && !p.excluido ? p : null; };
const editavel = p => !!p && p.status === "rascunho";
const ordenados = p => [...p.excertos].sort((a, b) => a.inicio - b.inicio || a.fim - b.fim);
const numeroDe = (p, e) => ordenados(p).indexOf(e) + 1;
const maiorNumero = () => Object.values(S.P).reduce((m, p) => { const x = /^REG-(\d+)$/.exec(p.id_registro || ""); return x ? Math.max(m, +x[1]) : m; }, 0);

const codigoDe = p => String((p && p.identificacao && p.identificacao.codigo_parecer) || "").toUpperCase();
/* A identidade de um registro é o seu selo. Um registro renumerado guarda também o selo de origem. */
const selosDe = o => o ? [o.integridade && o.integridade.resumo, o.origem && o.origem.integridade].filter(Boolean) : [];
const mesmoRegistro = (a, b) => { const s = selosDe(b); return selosDe(a).some(x => s.includes(x)); };
/* Outro parecer ativo com o mesmo código (a versão que este substitui não conta) */
const outroAtivoComCodigo = p => todos().find(x => x.key !== p.key && !x.demo === !p.demo && x.status !== "substituido" && codigoDe(x) === codigoDe(p) && !(p.substitui && x.id_registro === p.substitui));

/* ---------- a lei do lastro ----------
   Nível do registro = número de âncoras de observação (M1 a M4) presentes no excerto.
   0 = Ausencia (sem lastro) · 1 = Traco · 2 ou mais = Lastro.
   MC (menção com situação) = pelo menos uma âncora; MS = nenhuma. O rótulo (M5) não altera o nível. */
const nAncoras = e => ANC.reduce((a, m) => a + (e.marcas.includes(m) ? 1 : 0), 0);
const nivelPorN = n => n === 0 ? "Ausencia" : n === 1 ? "Traco" : "Lastro";
const nivelDo = e => nivelPorN(nAncoras(e));
const mcmsDo = e => nAncoras(e) ? "MC" : "MS";
const temRotulo = e => e.marcas.includes(ROTULO.c);

/* Palavras indicadoras encontradas no excerto: [{m, i, f}] */
function indicadoresNo(texto) {
  const achados = [];
  for (const [m, re] of Object.entries(INDICADORES)) {
    re.lastIndex = 0; let x;
    while ((x = re.exec(texto))) {
      const i = x.index + x[1].length; achados.push({ m, i, f: i + x[2].length });
      if (re.lastIndex === x.index) re.lastIndex++;
    }
  }
  return achados.sort((a, b) => a.i - b.i || b.f - a.f);
}
const marcasSugeridas = e => [...new Set(indicadoresNo(e.excerto_literal).map(a => a.m))].filter(m => !e.marcas.includes(m));

/* Conferência de um excerto: [tipo, mensagem]; tipo e = pendência que impede finalizar, w = alerta, i = nota */
function alertasDe(p, e) {
  const A = [];
  if (!e.ancora_ok) A.push(["e", "Trecho não localizado no texto do parecer, que foi alterado. Selecione o trecho de novo e use Ajustar o excerto aberto, ou exclua o excerto."]);
  if (!e.dimensao_dominante) A.push(["e", "Falta a dimensão dominante."]);
  if (/n[aã]o fala nada/i.test(e.excerto_literal) && !(e.dimensao_dominante === "DML" && e.blg_nivel === EMERG[1].niveis[0].v))
    A.push(["w", "“Não fala nada”: o livro pede dimensão linguística (DML) e barreira linguística como registro deficitário."]);
  if (e.duvida && !e.observacoes.trim()) A.push(["w", "Marcado como dúvida sem explicação nas notas."]);
  if (e.direitos.includes("DExp") && e.direitos.includes("DExpr")) A.push(["i", "Explorar (DExp) e Expressar (DExpr) marcados juntos: confira se são os dois."]);
  const n = palavras(e.excerto_literal);
  if (n > LIMITE_PALAVRAS_EXCERTO) A.push(["i", `Excerto com ${n} palavras: veja se dá para recortar só o fragmento que sustenta o código.`]);
  return A;
}
const pendenciasDe = p => p.excertos.reduce((a, e) => a + alertasDe(p, e).filter(x => x[0] === "e").length, 0);

/* Tudo o que se calcula de um parecer. Nada aqui é digitado. */
function resumoDoParecer(p) {
  const ex = p.excertos, tot = ex.length;
  const niv = { Ausencia: 0, Traco: 0, Lastro: 0 }, anc = { M1: 0, M2: 0, M3: 0, M4: 0 };
  let rot = 0, duv = 0, palEx = 0;
  const porDim = {}; DIMS.forEach(d => { porDim[d.c] = { total: 0, Ausencia: 0, Traco: 0, Lastro: 0 }; });
  const tem = { dimensao: new Set(), direito: new Set(), campo: new Set(), matriz: new Set() };
  const em = {}; EMERG.forEach(g => { em[g.c] = { n2: 0, n3: 0 }; });
  for (const e of ex) {
    const nv = nivelDo(e); niv[nv]++;
    ANC.forEach(m => { if (e.marcas.includes(m)) anc[m]++; });
    if (temRotulo(e)) rot++;
    if (e.duvida) duv++;
    palEx += palavras(e.excerto_literal);
    if (porDim[e.dimensao_dominante]) { tem.dimensao.add(e.dimensao_dominante); porDim[e.dimensao_dominante].total++; porDim[e.dimensao_dominante][nv]++; }
    e.direitos.forEach(c => tem.direito.add(c)); e.campos.forEach(c => tem.campo.add(c)); e.categorias_matriz.forEach(c => tem.matriz.add(c));
    EMERG.forEach(g => { if (e[g.f] === g.niveis[0].v) em[g.c].n2++; else if (e[g.f] === g.niveis[1].v) em[g.c].n3++; });
  }
  let pred = "";
  if (tot) { pred = "Equilibrio"; for (const n of NIVEIS) if (niv[n] / tot > 0.5) pred = n + " predominante"; }
  const emNivel = {};
  EMERG.forEach(g => { const { n2, n3 } = em[g.c]; emNivel[g.f] = n2 && n3 ? (g.misto || g.niveis[1].v) : n3 ? g.niveis[1].v : n2 ? g.niveis[0].v : NM; });
  const totPal = palavras(p.texto_parecer);
  return {
    tot, niv, pred, anc, rot, duv, porDim, tem, em, emNivel, totPal,
    cobertura: totPal ? Math.min(1, palEx / totPal) : 0,
    aus: {
      dimensao: DIMS.map(d => d.c).filter(c => !tem.dimensao.has(c)),
      direito: DIREITOS.map(d => d.c).filter(c => !tem.direito.has(c)),
      campo: CAMPOS.map(d => d.c).filter(c => !tem.campo.has(c)),
      matriz: MATRIZ.map(d => d.c).filter(c => !tem.matriz.has(c))
    }
  };
}

/* O que precisa estar pronto para finalizar */
function conferencia(p) {
  const id = p.identificacao, f = p.fechamento, pend = pendenciasDe(p);
  return [
    { t: "Identificação completa", ok: IDENT.every(g => id[g.f]), passo: "doc" },
    { t: "Texto do parecer colado", ok: palavras(p.texto_parecer) > 0, passo: "doc" },
    { t: "Texto anonimizado confirmado", ok: !!id.anonimizado, passo: "doc" },
    { t: "Pelo menos um excerto codificado", ok: p.excertos.length > 0, passo: "cod" },
    { t: pend ? `Excertos sem pendências (${pl(pend, "pendência", "pendências")} agora)` : "Excertos sem pendências", ok: pend === 0, passo: "cod" },
    { t: "Excerto representativo escolhido", ok: p.excertos.some(e => e.k === f.excerto_representativo), passo: "fec" },
    { t: "Síntese em uma frase", ok: !!f.sintese_uma_frase.trim(), passo: "fec" }
  ];
}
const passoPronto = (p, passo) => conferencia(p).filter(c => c.passo === passo).every(c => c.ok);

/* ---------- registro (o JSON de um parecer) ---------- */
function registroDe(p) {
  const ex = ordenados(p), r = resumoDoParecer(p), id = p.identificacao, f = p.fechamento, cod = id.codigo_parecer;
  const idEx = i => `${cod}-E${zeros(i + 1)}`;
  const iRep = ex.findIndex(e => e.k === f.excerto_representativo);
  const emCont = {}; EMERG.forEach(g => { emCont[g.c] = { nivel_2: r.em[g.c].n2, nivel_3: r.em[g.c].n3 }; });
  return {
    schema: APP.schema,
    instrumento: {
      nome: APP.nome, versao: APP.versao, livro_de_codigos: APP.livro,
      regra_nivel_registro: "Âncoras M1 a M4 presentes no excerto: 0 = Ausencia (sem lastro), 1 = Traco, 2 ou mais = Lastro. MC = pelo menos uma âncora; MS = nenhuma. M5 (rótulo) não altera o nível.",
      regra_nivel_predominante: "Nível presente em mais da metade dos excertos; se nenhum passa da metade, Equilibrio.",
      regra_emergentes_parecer: "Nível do parecer = o que foi marcado nos excertos; ESP fica com o nível mais alto; BLG e ACU com níveis 2 e 3 no mesmo parecer ficam como registro misto."
    },
    id_registro: p.id_registro, versao: p.versao, substitui: p.substitui || null, status: p.status, exemplo: !!p.demo,
    criado_em: p.criado_em, finalizado_em: p.finalizado_em,
    parecer: {
      codigo_parecer: cod, tipo_instituicao: id.tipo_instituicao, semestre: id.semestre, idade: id.idade ? +id.idade : null, imigracao: id.imigracao,
      extensao_palavras: r.totPal, texto_anonimizado_confirmado: !!id.anonimizado, n_excertos: r.tot, cobertura_do_texto: +r.cobertura.toFixed(3),
      nivel_registro_predominante: r.pred,
      excerto_representativo: iRep >= 0 ? ex[iRep].excerto_literal : "", excerto_representativo_id: iRep >= 0 ? idEx(iRep) : "",
      sintese_uma_frase: f.sintese_uma_frase, observacoes_gerais: f.observacoes_gerais
    },
    excertos: ex.map((e, i) => ({
      id_excerto: idEx(i), codigo_parecer: cod, localizacao: `${i + 1}o excerto`, posicao: { inicio: e.inicio, fim: e.fim },
      excerto_literal: e.excerto_literal,
      dimensao_dominante: e.dimensao_dominante, dimensao_nivel: mcmsDo(e), dimensao_secundaria: e.dimensao_secundaria || null,
      marcas_presentes: MARCAS_VALIDAS.filter(m => e.marcas.includes(m)), n_ancoras: nAncoras(e), nivel_registro: nivelDo(e),
      direitos: DIREITOS.map(d => d.c).filter(c => e.direitos.includes(c)),
      campos: CAMPOS.map(d => d.c).filter(c => e.campos.includes(c)),
      categorias_matriz: MATRIZ.map(d => d.c).filter(c => e.categorias_matriz.includes(c)),
      esp_nivel: e.esp_nivel, blg_nivel: e.blg_nivel, acu_nivel: e.acu_nivel,
      duvida: !!e.duvida, observacoes: e.observacoes
    })),
    ausencias: {
      dimensao_ausente: r.aus.dimensao, direito_ausente: r.aus.direito, campo_ausente: r.aus.campo, categoria_matriz_ausente: r.aus.matriz,
      esp_nivel: r.emNivel.esp_nivel, blg_nivel: r.emNivel.blg_nivel, acu_nivel: r.emNivel.acu_nivel,
      observacoes_ausencia: f.observacoes_ausencia
    },
    contagens: {
      nivel_registro: { ...r.niv }, por_dimensao: copia(r.porDim), ancoras: { ...r.anc }, rotulo_M5: r.rot, emergentes: emCont, duvidas: r.duv
    },
    texto_parecer: p.texto_parecer
  };
}
/* Sela o registro com um resumo criptográfico do próprio conteúdo */
async function selar(o) {
  const { integridade, ...resto } = o;
  return { ...resto, integridade: { sobre: "texto JSON compacto do registro, sem o campo integridade", resumo: await resumoDe(JSON.stringify(resto)) } };
}
/* true = íntegro · false = alterado depois de gerado · null = não foi possível verificar */
async function integro(o) {
  if (!o || !o.integridade || typeof o.integridade.resumo !== "string") return false;
  const { integridade, ...resto } = o, texto = JSON.stringify(resto);
  if (integridade.resumo.startsWith("crc32:")) return ("crc32:" + crc32(new TextEncoder().encode(texto)).toString(16).padStart(8, "0")) === integridade.resumo;
  const r = await resumoDe(texto);
  return r.startsWith("sha256:") ? r === integridade.resumo : null;
}
/* Sela de novo um registro cujo número, ou a referência à versão anterior, mudou.
   O bloco origem guarda como ele foi selado da primeira vez: número, referência e selo. */
async function reRegistrar(p, id, substitui) {
  if (p.registro) {
    const { integridade, ...o } = copia(p.registro);
    if (!o.origem) o.origem = { id_registro: o.id_registro, substitui: o.substitui || null, integridade: (integridade && integridade.resumo) || null };
    o.id_registro = id; o.substitui = substitui || null;
    p.registro = await selar(o); p.json_baixado = false;
  }
  p.id_registro = id; p.substitui = substitui || null; p.atualizado_em = depoisDe(p.atualizado_em);
}
/* Lei do número único. Se dois registros diferentes têm o mesmo número (dados reunidos de dois navegadores ou aparelhos),
   fica com ele o que já estava aqui ou, entre aparelhos, o finalizado primeiro. O outro recebe o próximo número livre. */
async function renumerarRepetidos(chegam = []) {
  const grupos = {}, ordem = (a, b) => String(a.finalizado_em || "").localeCompare(String(b.finalizado_em || "")) || a.key.localeCompare(b.key);
  for (const p of todos()) if (!p.demo && p.registro && /^REG-\d+$/.test(p.id_registro || "")) (grupos[p.id_registro] = grupos[p.id_registro] || []).push(p);
  const fila = [];
  for (const g of Object.values(grupos)) if (g.length > 1) { g.sort((a, b) => (chegam.includes(a) - chegam.includes(b)) || ordem(a, b)); fila.push(...g.slice(1)); }
  const trocas = [], mexidos = new Set();
  if (!fila.length) return { trocas, mexidos: [] };
  fila.sort(ordem);
  let n = Math.max(S.meta.contador || 0, maiorNumero());
  for (const p of fila) {
    const de = p.id_registro, para = "REG-" + zeros(++n, 4), cod = codigoDe(p);
    await reRegistrar(p, para, p.substitui); mexidos.add(p); trocas.push({ de, para, codigo: cod });
    for (const s of todos()) {
      if (s === p || s.demo || codigoDe(s) !== cod) continue;
      if (s.substitui === de) { await reRegistrar(s, s.id_registro, para); mexidos.add(s); }
      if (s.substituido_por === de) { s.substituido_por = para; s.atualizado_em = depoisDe(s.atualizado_em); mexidos.add(s); }
    }
  }
  S.meta.contador = n;
  return { trocas, mexidos: [...mexidos] };
}
/* Um código, um parecer ativo. Se dois aparelhos finalizaram o mesmo código sem se ver,
   vale o finalizado por último; o outro vai para o histórico. */
function umAtivoPorCodigo() {
  const por = {}, mexidos = [];
  for (const p of todos()) if (!p.demo && p.status === "finalizado") (por[codigoDe(p)] = por[codigoDe(p)] || []).push(p);
  for (const g of Object.values(por)) {
    if (g.length < 2) continue;
    g.sort((a, b) => String(b.finalizado_em || "").localeCompare(String(a.finalizado_em || "")) || b.key.localeCompare(a.key));
    for (const p of g.slice(1)) { p.status = "substituido"; p.substituido_por = g[0].id_registro; p.atualizado_em = depoisDe(p.atualizado_em); mexidos.push({ codigo: codigoDe(p), vale: g[0].id_registro, historico: p.id_registro }); }
  }
  return mexidos;
}
/* Reconstrói os campos de trabalho a partir de um registro */
function desmontar(o) {
  const pa = o.parecer || {};
  return {
    identificacao: { codigo_parecer: pa.codigo_parecer || "", tipo_instituicao: pa.tipo_instituicao || "", semestre: pa.semestre || "", idade: pa.idade ? String(pa.idade) : "", imigracao: pa.imigracao || "", anonimizado: !!pa.texto_anonimizado_confirmado },
    texto_parecer: o.texto_parecer || "",
    excertos: (o.excertos || []).map(e => ({
      k: e.id_excerto, inicio: e.posicao ? e.posicao.inicio : 0, fim: e.posicao ? e.posicao.fim : 0, excerto_literal: e.excerto_literal || "", ancora_ok: true,
      dimensao_dominante: e.dimensao_dominante || "", dimensao_secundaria: e.dimensao_secundaria || "",
      direitos: [...(e.direitos || [])], campos: [...(e.campos || [])], categorias_matriz: [...(e.categorias_matriz || [])],
      marcas: (e.marcas_presentes || []).filter(m => MARCAS_VALIDAS.includes(m)),
      esp_nivel: e.esp_nivel || NM, blg_nivel: e.blg_nivel || NM, acu_nivel: e.acu_nivel || NM, duvida: !!e.duvida, observacoes: e.observacoes || ""
    })),

/* Depois de editar o texto, relocaliza cada excerto pelo seu conteúdo literal */
function relocalizar(p) {
  const t = p.texto_parecer, usados = [];
  for (const e of ordenados(p)) {

    if (t.slice(e.inicio, e.fim) === e.excerto_literal) melhor = e.inicio;
    else {
      let i = t.indexOf(e.excerto_literal);
      while (i !== -1) { if (melhor === -1 || Math.abs(i - e.inicio) < Math.abs(melhor - e.inicio)) melhor = i; i = t.indexOf(e.excerto_literal, i + 1); }
    }
    const f = melhor + e.excerto_literal.length;
    if (melhor >= 0 && !usados.some(u => melhor < u[1] && f > u[0])) { e.inicio = melhor; e.fim = f; e.ancora_ok = true; usados.push([melhor, f]); }

const store = {

  /* Próximo número de registro: relê a conta antes, para nunca repetir um número dado em outro aparelho */

/* ---------- arquivos: JSON, ZIP, CSV, fichas, backup, importação ---------- */

async function comprimir(u8) {
  if (typeof CompressionStream === "undefined") return null;
  try { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); }
  catch (e) { return null; }
}
/* ZIP mínimo e padrão (deflate quando o navegador oferece; senão, sem compressão). Nomes em UTF-8. */
async function montarZip(arquivos) {
  const enc = new TextEncoder(), partes = [], indice = []; let pos = 0;
  const d = new Date();
  const hora = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dia = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const a of arquivos) {
    const nome = enc.encode(a.nome), bruto = typeof a.dados === "string" ? enc.encode(a.dados) : a.dados;
    const crc = crc32(bruto); let comp = await comprimir(bruto), metodo = 8;
    if (!comp || comp.length >= bruto.length) { comp = bruto; metodo = 0; }
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, metodo, true);
    lh.setUint16(10, hora, true); lh.setUint16(12, dia, true); lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true);
    lh.setUint32(22, bruto.length, true); lh.setUint16(26, nome.length, true); lh.setUint16(28, 0, true);
    partes.push(new Uint8Array(lh.buffer), nome, comp);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, metodo, true);
    ch.setUint16(12, hora, true); ch.setUint16(14, dia, true); ch.setUint32(16, crc, true); ch.setUint32(20, comp.length, true); ch.setUint32(24, bruto.length, true);
    ch.setUint16(28, nome.length, true); ch.setUint32(42, pos, true);
    indice.push(new Uint8Array(ch.buffer), nome);
    pos += 30 + nome.length + comp.length;
  }
  const tamIndice = indice.reduce((s, b) => s + b.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamIndice, true); fim.setUint32(16, pos, true);
  return new Blob([...partes, ...indice, new Uint8Array(fim.buffer)], { type: "application/zip" });
}

function fichaMd(o) {
  const pa = o.parecer, c = o.contagens, a = o.ausencias, L = [];
  const lista = v => v && v.length ? v.join(", ") : "nenhuma ausência";
  const barra = s => String(s ?? "").replace(/\|/g, "\\|").replace(/\s*\n\s*/g, " ");
  L.push(`# Parecer ${pa.codigo_parecer}`, "",
    `Registro ${o.id_registro || "(rascunho)"}, versão ${o.versao}${o.substitui ? `, substitui ${o.substitui}` : ""}. ${APP.livro}.`, "",
    `- Instituição: ${pa.tipo_instituicao}`, `- Semestre: ${pa.semestre}`, `- Idade: ${pa.idade} anos`, `- Imigração: ${rotIdent("imigracao", pa.imigracao)}`,
    `- Extensão: ${pa.extensao_palavras} palavras, ${pa.n_excertos} excertos, ${Math.round(100 * (pa.cobertura_do_texto || 0))}% do texto codificado`, "",
    "## Síntese", "", pa.sintese_uma_frase || "(sem síntese)", "",
    "## Excerto representativo", "", pa.excerto_representativo ? "> " + pa.excerto_representativo.replace(/\n+/g, " ") : "(não escolhido)", "",

    `Rótulo (M5) em ${c.rotulo_M5} excerto(s).`, "",
    "| Dimensão | Excertos | Sem lastro | Traço | Lastro |", "|---|---:|---:|---:|---:|",
    ...DIMS.map(d => { const x = c.por_dimensao[d.c] || { total: 0, Ausencia: 0, Traco: 0, Lastro: 0 }; return `| ${d.c} ${d.n} | ${x.total} | ${x.Ausencia} | ${x.Traco} | ${x.Lastro} |`; }), "",
    "## Não registrado neste parecer", "",
    `- Dimensões: ${lista(a.dimensao_ausente)}`, `- Direitos de Aprendizagem: ${lista(a.direito_ausente)}`, `- Campos de Experiência: ${lista(a.campo_ausente)}`, `- Categorias matriz: ${lista(a.categoria_matriz_ausente)}`,
    ...(a.observacoes_ausencia ? ["", a.observacoes_ausencia] : []), "",
    "## Sinais", "",
    ...EMERG.map(g => `- ${g.n} (${g.c}): ${rotEmerg(g, a[g.f])}`), "",
    "## Excertos", "",
    "| Nº | Excerto literal | Dimensão | Nível | Marcas | Direitos | Campos | Matriz | Sinais | Notas |", "|---|---|---|---|---|---|---|---|---|---|",
    ...o.excertos.map((e, i) => {
      const sinais = EMERG.filter(g => e[g.f] && e[g.f] !== NM).map(g => `${g.c}: ${rotEmerg(g, e[g.f])}`).join("; ");
      return `| ${i + 1} | ${barra(e.excerto_literal)} | ${e.dimensao_dominante}${e.dimensao_secundaria ? ` (+${e.dimensao_secundaria})` : ""} | ${ROT_NIVEL[e.nivel_registro]} (${e.dimensao_nivel}) | ${e.marcas_presentes.join(", ")} | ${e.direitos.join(", ")} | ${e.campos.join(", ")} | ${e.categorias_matriz.join(", ")} | ${sinais} | ${e.duvida ? "DÚVIDA. " : ""}${barra(e.observacoes)} |`;
    }), "");
  if (pa.observacoes_gerais) L.push("## Observações gerais", "", pa.observacoes_gerais, "");
  return L.join("\n");
}

/* Entrega um arquivo. Se a visualização não permitir download, oferece o conteúdo para copiar. */
async function entregar(nome, dados, textoAlternativo) {
  const dl = await capacidade("downloads");
  if (dl) {
    try { await dl.save({ filename: nome, data: dados }); avisar("Arquivo entregue: " + nome); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "declined") { avisar("Download cancelado."); return false; }
      if (c === "rate_limited") { avisar("Já há um download aguardando a sua confirmação."); return false; }
    }
  }
  /* Fora do claude.ai (GitHub Pages, arquivo aberto no computador): o navegador baixa o arquivo direto */
  if (!window.claude) {
    try {
      const blob = dados instanceof Blob ? dados : new Blob([dados], { type: /\.zip$/i.test(nome) ? "application/zip" : "application/json" });
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = nome; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      avisar("Arquivo baixado: " + nome); return true;
    } catch (e) { /* segue para copiar */ }
  }
  if (textoAlternativo) { modalCopiar(nome, textoAlternativo); return false; }
  avisar("Esta visualização não permite baixar arquivos. Abra o Codificador no claude.ai.", 6000);
  return false;
}

/* Importa backup, pacote ou registros avulsos. Três leis:
   1) Nunca grava por cima: a identidade de um registro é o seu selo; o que já está aqui é só contado como repetido.
   2) Um código, uma linhagem: se o código já tem parecer ativo aqui, o que chega fica de fora, a não ser que seja a correção dele.
   3) Número único: registro que chega com um número já usado aqui por outro parecer recebe o próximo número livre e guarda o de origem. */
async function importar(lista) {
  const r = { novos: 0, historico: 0, repetidos: 0, exemplos: 0, conflitos: [], renumerados: [], alterados: 0, estranhos: 0 }, chegando = [];
  const conhecido = o => [...todos(), ...chegando].some(x => x.registro && mesmoRegistro(x.registro, o));
  const aceitaRegistro = async o => {
    if (!o || o.schema !== APP.schema || !o.id_registro || !o.parecer || !Array.isArray(o.excertos)) { r.estranhos++; return; }
    if (o.exemplo) { r.exemplos++; return; }
    if ((await integro(o)) === false) { r.alterados++; return; }
    if (conhecido(o)) { r.repetidos++; return; }
    chegando.push(aoAbrir({ key: uid(), modelo: APP.modelo, status: "finalizado", demo: false, versao: o.versao || 1, id_registro: o.id_registro, substitui: o.substitui || null,
      registro: o, json_baixado: true, criado_em: o.criado_em || agora(), finalizado_em: o.finalizado_em || null, atualizado_em: agora() }));
  };
  for (const arq of lista) {
    let o; try { o = JSON.parse(await arq.text()); } catch (e) { r.estranhos++; continue; }
    if (o && o.tipo === "backup-completo" && Array.isArray(o.pareceres)) {
      if (o.meta && o.meta.contador) S.meta.contador = Math.max(S.meta.contador || 0, o.meta.contador);
      for (const g of o.pareceres) {
        if (!g || !g.key || g.excluido || g.demo) continue;
        if ((S.P[g.key] && !S.P[g.key].excluido) || chegando.some(x => x.key === g.key)) { r.repetidos++; continue; }
        if (g.registro) {
          if ((await integro(g.registro)) === false) { r.alterados++; continue; }
          if (conhecido(g.registro)) { r.repetidos++; continue; }
        }
        chegando.push(aoAbrir(copia(g)));
      }
    } else if (o && o.tipo === "pacote-final" && Array.isArray(o.registros)) {
      for (const x of [...o.registros, ...(o.historico || [])]) await aceitaRegistro(x);
    } else await aceitaRegistro(o);
  }
  /* quem foi substituído por quem: vale a versão seguinte já finalizada, procurada primeiro no que chega e depois aqui */
  const locais = todos().filter(x => !x.demo);
  for (const p of chegando) if (p.status !== "rascunho") {
    const segue = y => y !== p && y.status !== "rascunho" && codigoDe(y) === codigoDe(p) && y.substitui && y.substitui === p.id_registro;
    const suc = chegando.find(segue) || (locais.some(x => codigoDe(x) === codigoDe(p) && x.id_registro === p.id_registro) ? null : locais.find(segue));
    if (suc) { p.status = "substituido"; p.substituido_por = suc.id_registro || null; } else { p.status = "finalizado"; delete p.substituido_por; }
  }
  /* um código, uma linhagem */
  const aceitos = [], tocados = [], grupos = {};
  for (const p of chegando) (grupos[codigoDe(p)] = grupos[codigoDe(p)] || []).push(p);
  for (const [cod, g] of Object.entries(grupos)) {
    const emCorrecao = p => p.status === "finalizado" && g.some(y => y.status === "rascunho" && y.substitui === p.id_registro);   // finalizado com correção em rascunho: um par, não dois rivais
    const ativos = g.filter(p => p.status !== "substituido" && !emCorrecao(p)), a = ativos[0];
    const aqui = locais.filter(x => x.status !== "substituido" && codigoDe(x) === cod), local = aqui[0];
    if (ativos.length > 1 || (a && aqui.length > 1)) { r.conflitos.push(cod); continue; }
    if (a && local) {
      /* só entra se for a correção do parecer que está aqui (a referência pode trazer o número que ele tinha na origem) */
      const eLocal = id => !!id && (id === local.id_registro || (local.registro && local.registro.origem && local.registro.origem.id_registro === id));
      const corrige = local.status === "finalizado" && eLocal(a.substitui) && (a.versao || 1) > (local.versao || 1) && !g.some(y => y !== a && y.id_registro === a.substitui);
      if (!corrige) { r.conflitos.push(cod); continue; }
      if (a.substitui !== local.id_registro) await reRegistrar(a, a.id_registro, local.id_registro);
      if (a.status === "finalizado") { local.status = "substituido"; local.substituido_por = a.id_registro; local.atualizado_em = depoisDe(local.atualizado_em); tocados.push(local); }
    }
    aceitos.push(...g); if (a) r.novos++;
  }
  for (const p of aceitos) { S.P[p.key] = p; if (p.status === "substituido") r.historico++; }
  await migrarTudo();
  if (aceitos.some(p => p.registro)) {
    S.meta.contador = Math.max(S.meta.contador || 0, (await store.proximoNumero()) - 1);
    const ren = await renumerarRepetidos(aceitos);
    r.renumerados = ren.trocas;
    for (const p of ren.mexidos) if (!aceitos.includes(p) && !tocados.includes(p)) tocados.push(p);
  }
  S.meta.contador = Math.max(S.meta.contador || 0, maiorNumero());
  for (const p of [...aceitos, ...tocados]) if (S.P[p.key]) await store.gravarJa(S.P[p.key]);
  await store.gravarMeta();
  return r;
}


/* ======================= SEÇÃO 06 · concordância e segunda leitura ======================= */
/* ---------- concordância entre codificações ----------
   Operacionaliza a regra da objetividade: duas pessoas codificando o mesmo trecho devem chegar ao mesmo resultado.
   Medidas: concordância observada e kappa de Cohen (1960); leitura das faixas segundo Landis e Koch (1977). */

const paraComparar = e => ({
  inicio: e.inicio, fim: e.fim, texto: e.excerto_literal || "", dim: e.dimensao_dominante || "",
  marcas: [...(e.marcas || e.marcas_presentes || [])].filter(m => MARCAS_VALIDAS.includes(m)),
  direitos: e.direitos || [], campos: e.campos || [], matriz: e.categorias_matriz || [],
  esp: e.esp_nivel || NM, blg: e.blg_nivel || NM, acu: e.acu_nivel || NM, motivo: e.motivo || ""
});
const nivelCmp = x => nivelPorN(ANC.filter(m => x.marcas.includes(m)).length);

/* Pareia trechos das duas codificações pela sobreposição no texto (pelo menos metade do trecho menor) */
function parear(A, B) {
  const cand = [];
  A.forEach((a, i) => B.forEach((b, j) => {
    const sob = Math.min(a.fim, b.fim) - Math.max(a.inicio, b.inicio);
    if (sob > 0 && sob / Math.max(1, Math.min(a.fim - a.inicio, b.fim - b.inicio)) >= 0.5) cand.push({ i, j, sob });
  }));
  cand.sort((x, y) => y.sob - x.sob || x.i - y.i || x.j - y.j);
  const usA = new Set(), usB = new Set(), pares = [];
  for (const c of cand) { if (usA.has(c.i) || usB.has(c.j)) continue; usA.add(c.i); usB.add(c.j); pares.push([A[c.i], B[c.j]]); }
  pares.sort((x, y) => x[0].inicio - y[0].inicio);
  return { pares, soA: A.filter((_, i) => !usA.has(i)), soB: B.filter((_, j) => !usB.has(j)) };
}

/* Kappa de Cohen: k = (po - pe) / (1 - pe). k = null quando não há variação (pe = 1) ou não há pares. */
function kappa(pares, fa, fb = fa) {
  const n = pares.length; if (!n) return { n: 0, iguais: 0, po: null, k: null };
  const ca = {}, cb = {}; let iguais = 0;
  for (const [a, b] of pares) { const x = String(fa(a)), y = String(fb(b)); if (x === y) iguais++; ca[x] = (ca[x] || 0) + 1; cb[y] = (cb[y] || 0) + 1; }
  const po = iguais / n; let pe = 0;
  for (const c of new Set([...Object.keys(ca), ...Object.keys(cb)])) pe += ((ca[c] || 0) / n) * ((cb[c] || 0) / n);
  return { n, iguais, po, k: 1 - pe < 1e-12 ? null : (po - pe) / (1 - pe) };
}
const faixaKappa = k => k === null ? "sem variação" : k < 0 ? "pobre" : k <= 0.20 ? "leve" : k <= 0.40 ? "razoável" : k <= 0.60 ? "moderada" : k <= 0.80 ? "substancial" : "quase perfeita";

/* Compara a codificação de um parecer (A) com uma segunda codificação (B = {origem, texto, excertos}) */
function comparar(p, B) {
  const A = ordenados(p).filter(e => e.ancora_ok).map(paraComparar);
  let exB = (B.excertos || []).map(paraComparar), fora = 0;
  if ((B.texto || "") !== p.texto_parecer) {            // textos diferentes: relocaliza cada trecho de B no texto de A
    const usados = [];
    exB = exB.filter(b => {
      let i = b.texto ? p.texto_parecer.indexOf(b.texto) : -1;
      while (i !== -1) {
        const f = i + b.texto.length;
        if (!usados.some(u => i < u[1] && f > u[0])) { b.inicio = i; b.fim = f; usados.push([i, f]); return true; }
        i = p.texto_parecer.indexOf(b.texto, i + 1);
      }
      fora++; return false;
    });
  }
  const { pares, soA, soB } = parear(A, exB);
  const linha = (cod, rot, f) => ({ cod, rot, ...kappa(pares, f) });
  const tem = (campo, c) => x => x[campo].includes(c) ? 1 : 0;
  return {
    origem: B.origem || "Segunda codificação", nA: A.length, nB: exB.length + fora, pares: pares.length, soA, soB, fora,
    principais: [
      linha("", "Dimensão dominante", x => x.dim), linha("", "Nível do registro", nivelCmp),
      ...ANCORAS.map(a => linha(a.c, a.nome, tem("marcas", a.c))), linha(ROTULO.c, ROTULO.nome, tem("marcas", ROTULO.c))
    ],
    referenciais: [
      ...DIREITOS.map(d => linha(d.c, d.n, tem("direitos", d.c))), ...CAMPOS.map(d => linha(d.c, d.n, tem("campos", d.c))), ...MATRIZ.map(d => linha(d.c, d.n, tem("matriz", d.c)))
    ],
    sinais: EMERG.map(g => linha(g.c, g.n, x => x[g.c.toLowerCase()])),
    divergencias: pares.filter(([a, b]) => a.dim !== b.dim || MARCAS_VALIDAS.some(m => a.marcas.includes(m) !== b.marcas.includes(m)) || a.esp !== b.esp || a.blg !== b.blg || a.acu !== b.acu)
  };
}

/* Segunda codificação a partir de um arquivo JSON do mesmo parecer */
async function segundaDeArquivo(p, arquivo) {
  let o; try { o = JSON.parse(await arquivo.text()); } catch (e) { throw new Error("O arquivo não é um JSON válido."); }
  if (!o || o.schema !== APP.schema || !o.parecer || !Array.isArray(o.excertos)) throw new Error("O arquivo não é um registro de parecer deste instrumento.");
  if (String(o.parecer.codigo_parecer).toUpperCase() !== p.identificacao.codigo_parecer.toUpperCase()) throw new Error(`O arquivo é do parecer ${o.parecer.codigo_parecer}, e não do ${p.identificacao.codigo_parecer}.`);
  const ok = await integro(o);
  return {
    origem: `Arquivo ${arquivo.name}${o.id_registro ? ` (${o.id_registro})` : ""}${ok === false ? ", alterado depois de gerado" : ""}`, texto: o.texto_parecer || "",

}

const DIVERGENCIAS_EXEMPLO = [

function segundaDeExemplo(p) {

      if ("blg" in d) c.blg_nivel = d.blg;

      </div>
    </div>
  </div>`;
}
function htmlConf(conf) {

/* Atualiza a conferência do fechamento sem redesenhar os campos em que a pessoa está digitando */
function pintarConf() {

/* ======================= SEÇÃO 09 · desenho: painel ======================= */
/* ---------- desenho: painel de resultados ----------
   Organizado pelas mesmas quatro perguntas da codificação. Cada pergunta tem a sua contagem:
   conjuntos diferentes nunca são somados. Entram só pareceres finalizados. */
function dadosDoPainel() {
  let ps = finalizados(), exemplo = false;
  if (!ps.length) { const d = todos().find(p => p.demo && p.excertos.length); if (d) { ps = [d]; exemplo = true; } }
  const zero = () => ({ Ausencia: 0, Traco: 0, Lastro: 0 });
  const D = { N: ps.length, exemplo, E: 0, niv: zero(), porDim: {}, anc: { M1: 0, M2: 0, M3: 0, M4: 0 }, rot: 0, pres: {}, occ: {}, em: {}, emImig: {}, nImig: 0, grupos: [], rascunhos: reais().filter(p => p.status === "rascunho").length };
  DIMS.forEach(d => { D.porDim[d.c] = { total: 0, ...zero() }; });
  [...DIMS, ...DIREITOS, ...CAMPOS, ...MATRIZ].forEach(d => { D.pres[d.c] = 0; D.occ[d.c] = 0; });
  EMERG.forEach(g => { D.em[g.c] = { nm: 0, n2: 0, n3: 0, misto: 0 }; D.emImig[g.c] = { nm: 0, n2: 0, n3: 0, misto: 0 }; });
  const grupos = {}; IDENT.forEach(g => g.op.forEach(o => { grupos[g.f + "|" + o[0]] = { variavel: g.rot, valor: o[1], N: 0, niv: zero() }; }));
  for (const p of ps) {
    const r = resumoDoParecer(p), id = p.identificacao, imig = id.imigracao === "Sim";
    D.E += r.tot; D.rot += r.rot;
    NIVEIS.forEach(n => { D.niv[n] += r.niv[n]; }); ANC.forEach(m => { D.anc[m] += r.anc[m]; });
    DIMS.forEach(d => { const x = r.porDim[d.c]; D.porDim[d.c].total += x.total; NIVEIS.forEach(n => { D.porDim[d.c][n] += x[n]; }); });
    for (const conj of [r.tem.dimensao, r.tem.direito, r.tem.campo, r.tem.matriz]) conj.forEach(c => { D.pres[c]++; });
    for (const e of p.excertos) [...e.direitos, ...e.campos, ...e.categorias_matriz].forEach(c => { if (c in D.occ) D.occ[c]++; });
    if (imig) D.nImig++;
    EMERG.forEach(g => { const v = r.emNivel[g.f], k = v === NM ? "nm" : v === g.misto ? "misto" : v === g.niveis[0].v ? "n2" : "n3"; D.em[g.c][k]++; if (imig) D.emImig[g.c][k]++; });
    IDENT.forEach(g => { const x = grupos[g.f + "|" + id[g.f]]; if (x) { x.N++; NIVEIS.forEach(n => { x.niv[n] += r.niv[n]; }); } });
  }
  DIMS.forEach(d => { D.occ[d.c] = D.porDim[d.c].total; });
  D.grupos = Object.values(grupos).filter(g => g.N > 0);
  D.lista = [...ps].sort((a, b) => ordenaCodigo(a.identificacao.codigo_parecer, b.identificacao.codigo_parecer));
  return D;
}

  let variavel = "";
  const grupos = D.grupos.map(g => { const cab = g.variavel !== variavel ? `<div class="grupo">${g.variavel}</div>` : ""; variavel = g.variavel; return cab + linhaNiveis(esc(g.valor), g.niv, `${par(g.N)}, ${exc(tot(g.niv))}`); }).join("");

/* Excertos marcados como dúvida, em todos os pareceres em andamento ou finalizados: a pauta da orientação */
function duvidasMarcadas() {
  const base = reais().length ? reais() : todos().filter(p => p.demo);            // sem pareceres reais, mostra as dúvidas do exemplo
  return base.sort((a, b) => ordenaCodigo(a.identificacao.codigo_parecer, b.identificacao.codigo_parecer))
    .flatMap(p => ordenados(p).map((e, i) => ({ p, e, n: i + 1 })).filter(x => x.e.duvida));
}

}
function pautaDeDivergencias(p, res) {
  const d = x => `${x.dim || "sem dimensão"}, ${ROT_NIVEL[nivelCmp(x)]} (${x.marcas.length ? x.marcas.join(", ") : "nenhuma marca"})` + EMERG.filter(g => x[g.c.toLowerCase()] !== NM).map(g => `; ${g.c}: ${rotEmerg(g, x[g.c.toLowerCase()]).toLowerCase()}`).join("");
  const L = [`Divergências de codificação: parecer ${p.identificacao.codigo_parecer}`, res.origem, ""];
  res.divergencias.forEach(([a, b], i) => { L.push(`${i + 1}. «${a.texto}»`, `   Primeira codificação: ${d(a)}`, `   Segunda codificação: ${d(b)}${b.motivo ? ". Motivo: " + b.motivo : ""}`, ""); });
  res.soA.forEach(a => L.push(`Só na primeira codificação: «${a.texto}» (${d(a)})`, ""));
  res.soB.forEach(b => L.push(`Só na segunda codificação: «${b.texto}» (${d(b)})`, ""));
  return L.join("\n");
}

function intervaloSelecionado() {
  const box = $("#texto"), p = atual(); if (!box || !p) return null;
  const s = window.getSelection(); if (!s || !s.rangeCount || s.isCollapsed) return null;
  const r = s.getRangeAt(0); if (!box.contains(r.startContainer) || !box.contains(r.endContainer)) return null;
  const pre = document.createRange(); pre.selectNodeContents(box); pre.setEnd(r.startContainer, r.startOffset);
  const t = p.texto_parecer; let i = pre.toString().length, f = i + r.toString().length;
  while (i < f && /\s/.test(t[i])) i++;
  while (f > i && /\s/.test(t[f - 1])) f--;
  if (f <= i) return null;
  while (i > 0 && ehLetra(t[i - 1]) && ehLetra(t[i])) i--;               // completa a palavra à esquerda
  while (f < t.length && ehLetra(t[f]) && ehLetra(t[f - 1])) f++;         // e à direita
  return { inicio: i, fim: f };
}

  aoTopoDaFolha();

function validaCodigo(v) {
  const c = String(v).trim().toUpperCase();
  if (!c) return { ok: false, msg: "Use o código dado pela Secretaria: P seguido de dois dígitos, como P07." };
  if (!/^P\d{2,3}$/.test(c)) return { ok: false, erro: true, msg: "O código é P seguido de dois dígitos, como P07." };
  const ja = codigoEmUso(c);
  if (ja) return { ok: false, erro: true, msg: `${c} já existe (${ja.status === "finalizado" ? "finalizado como " + ja.id_registro : "em rascunho"}). Para corrigir um parecer finalizado, abra-o e escolha Corrigir em nova versão.` };
  return { ok: true, c, msg: "Código disponível." };
}

/* O que a importação fez, em frases: o que entrou, o que já estava, o que mudou de número e o que ficou de fora */
function relatoImportacao(r) {
  const f = [`${pl(r.novos, "parecer importado", "pareceres importados")}${r.historico ? `, com ${pl(r.historico, "versão anterior no histórico", "versões anteriores no histórico")}` : ""}.`];
  if (r.repetidos) f.push(`${pl(r.repetidos, "item já estava aqui e ficou como estava", "itens já estavam aqui e ficaram como estavam")}: nada é gravado por cima.`);
  if (r.renumerados.length) {
    const t = r.renumerados, mostra = t.slice(0, 8).map(x => `${esc(x.codigo)}, de ${esc(x.de)} para ${esc(x.para)}`).join("; ");
    f.push(`${pl(t.length, "registro recebeu novo número, porque o número de origem já estava em uso aqui", "registros receberam novo número, porque o número de origem já estava em uso aqui")}: ${mostra}${t.length > 8 ? `; e mais ${t.length - 8}` : ""}. O número de origem fica guardado no registro.`);
  }
  if (r.conflitos.length) f.push(`<span class="nao">Não importado: ${r.conflitos.map(esc).join(", ")}.</span> ${r.conflitos.length > 1 ? "Esses códigos já têm parecer aqui" : "Esse código já tem parecer aqui"}, e o Codificador não escolhe entre duas codificações. Para trocar a de um parecer finalizado, use Corrigir em nova versão.`);
  if (r.alterados) f.push(`<span class="nao">${pl(r.alterados, "registro recusado", "registros recusados")}: o conteúdo foi alterado depois de gerado.</span>`);
  if (r.exemplos) f.push("O parecer de exemplo não é importado.");
  if (r.estranhos) f.push(`${pl(r.estranhos, "arquivo não reconhecido", "arquivos não reconhecidos")}.`);
  return f.map(x => `<p>${x}</p>`).join("");
}

  const t = ev.target, p = atual();

    if (t.id === "arqImportar") {
      const arqs = [...t.files]; t.value = ""; if (!arqs.length) return;
      avisar("Importando. Aguarde um instante.", 120000);
      let r; try { r = await importar(arqs); } finally { clearTimeout(avisar.t); const q = $("#avisoRaiz"); if (q) q.innerHTML = ""; }
      desenhar();

      return;
    }
    if (t.id === "arqConc") {
      const arq = t.files[0], q = S.P[S.conc.chave]; t.value = ""; if (!arq || !q) return;
      try { const B = await segundaDeArquivo(q, arq); S.conc = { chave: q.key, B, res: comparar(q, B), erro: "" }; }
      catch (e) { S.conc = { chave: q.key, B: null, res: null, erro: e.message || "Não foi possível ler o arquivo." }; }

    }
    if (t.id === "concP") { S.conc = { chave: t.value, B: null, res: null, erro: "" }; desenhar(); return; }

function criarExemplo() {
  const p = novoParecer("EX07", true), X = i => EXEMPLO[i][0], nv = (g, n) => n === 2 ? g.niveis[0].v : n === 3 ? g.niveis[1].v : NM;

    "Em geral, ", X(10), " ", X(11), " ", X(12), "\n\n", X(13), " ", X(14), " ", X(15), "\n\n", X(16), " ", X(17), "\n\n", "Para o próximo semestre, ", X(18), " ", X(19)].join("");
  let de = 0;
  EXEMPLO.forEach(r => {
    const i = p.texto_parecer.indexOf(r[0], de); de = i + r[0].length;
    const e = novoExcerto(i, de, r[0]);
    Object.assign(e, { dimensao_dominante: r[1], direitos: [...r[3]], campos: [...r[4]], categorias_matriz: [...r[5]], esp_nivel: nv(EMERG[0], r[6]), blg_nivel: nv(EMERG[1], r[7]), acu_nivel: nv(EMERG[2], r[8]),
      marcas: r[9].filter(m => MARCAS_VALIDAS.includes(m)), observacoes: r[10] });
    p.excertos.push(e);
  });
  p.fechamento = {

  };
  S.P[p.key] = p; store.guardar(p);
  return p;
}
function carregarExemplo() {

/* ---------- início ---------- */
async function iniciar(memoria) {
  lerRota(); desenhar();
  try { await store.iniciar(); }
  catch (e) { console.error(e); store.modo = store.lsOk ? "local" : "memoria"; }
  capacidade("sample").then(v => { S.temIA = !!v; if (S.pronto && S.vista === "conc") desenhar(); });
  capacidade("downloads");
  if (S.refazerExemplo || !todos().length) criarExemplo();
  S.pronto = true;
  const m = memoria && memoria.sel && S.P[memoria.sel] && !S.P[memoria.sel].excluido ? memoria : null;
  if (m) { S.sel = m.sel; S.passo = m.passo || "cod"; S.ex = m.ex || null; if (m.vista && !location.hash) S.vista = m.vista; }
  else {
    const p = reais().find(x => x.status === "rascunho") || todos().find(x => x.demo) || todos()[0];
    if (p) { S.sel = p.key; S.passo = p.texto_parecer ? "cod" : "doc"; const ex = ordenados(p); S.ex = ex.length ? ex[p.demo ? Math.min(3, ex.length - 1) : 0].k : null; }
  }
  desenhar();
}
/* Mantém o lugar de quem está com a página aberta quando uma nova versão é publicada */
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") window.claude.hot.snapshot(() => ({ vista: S.vista, sel: S.sel, passo: S.passo, ex: S.ex })); } catch (e) { /* fora do visualizador */ }
let partiu = false;
const partida = d => {
  if (partiu) return; partiu = true;
  iniciar(d || {}).catch(e => {
    console.error(e);
    const c = $("#corpo"); if (c) c.innerHTML = `<div class="carregando" role="alert">Não foi possível abrir os pareceres. Recarregue a página.</div>`;
  });
};
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === "function") {
  try { window.claude.hot.ready(partida); } catch (e) { /* segue pelo relógio abaixo */ }
  setTimeout(partida, 2500);                              // se o visualizador não chamar de volta, a página abre assim mesmo
} else partida(window.claude && window.claude.hot ? window.claude.hot.data : {});
